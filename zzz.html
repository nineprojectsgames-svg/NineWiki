<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zenless Zone Zero — Wiki de Builds | Nine Games</title>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&family=Barlow:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:        #0a0c10;
      --surface:   #0f1219;
      --surface2:  #161b26;
      --border:    #1e2535;
      --accent:    #f5c400;
      --accent2:   #ff6b1a;
      --accent3:   #00d4ff;
      --text:      #c8d0e0;
      --text-dim:  #5a6478;
      --text-bright: #edf0f7;
      --red:       #ff3e5e;
      --green:     #00e5a0;
      --rank-s:    #f5c400;
      --rank-a:    #aa66ff;
      --rank-b:    #44aaff;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Barlow', sans-serif;
      font-size: 14px;
      line-height: 1.6;
      min-height: 100vh;
      overflow-x: hidden;
    }
    body::before {
      content: '';
      position: fixed; inset: 0;
      background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,.08) 2px, rgba(0,0,0,.08) 4px);
      pointer-events: none;
      z-index: 9999;
    }
    header {
      position: sticky; top: 0; z-index: 100;
      background: rgba(10,12,16,.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 0 2rem;
      display: flex; align-items: center; gap: 1rem;
      height: 60px;
    }
    .logo { font-family: 'Rajdhani', sans-serif; font-size: 1.4rem; font-weight: 700; letter-spacing: .12em; color: var(--accent); text-shadow: 0 0 20px rgba(245,196,0,.4); white-space: nowrap; text-decoration: none; }
    .logo span { color: var(--accent2); }
    .site-nav { display: flex; gap: 1rem; margin-left: 0.5rem; }
    .nav-link { color: var(--text-dim); text-decoration: none; font-size: 0.9rem; font-weight: 600; transition: color .2s; }
    .nav-link:hover, .nav-link.active { color: var(--accent); }
    .header-game { font-family: 'Share Tech Mono', monospace; font-size: .72rem; color: var(--text-dim); letter-spacing: .08em; border: 1px solid var(--border); padding: .2rem .6rem; border-radius: 2px; white-space: nowrap; }
    .section-tabs { display: flex; gap: 0.55rem; margin-left: 1rem; }
    .section-tab {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.35rem 0.9rem;
      border-radius: 999px;
      cursor: pointer;
      font-family: 'Rajdhani', sans-serif;
      font-size: 0.8rem;
      transition: all 0.2s ease;
    }
    .section-tab.active,
    .section-tab:hover {
      background: rgba(245,196,0,.15);
      border-color: var(--accent);
      color: var(--accent);
    }
    .header-right { margin-left: auto; display: flex; align-items: center; gap: 1rem; }
    #search-input { background: var(--surface2); border: 1px solid var(--border); color: var(--text); font-family: 'Share Tech Mono', monospace; font-size: .8rem; padding: .4rem .8rem; border-radius: 3px; width: 200px; outline: none; transition: border-color .2s; }
    #search-input:focus { border-color: var(--accent); }
    #search-input::placeholder { color: var(--text-dim); }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 8px var(--green); animation: pulse 2s infinite; }
    .status-dot.loading { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
    .status-dot.error   { background: var(--red);   box-shadow: 0 0 8px var(--red); animation: none; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
    .layout { display: flex; min-height: calc(100vh - 60px); }
    .sidebar { width: 220px; flex-shrink: 0; background: var(--surface); border-right: 1px solid var(--border); padding: 1.5rem 0; position: sticky; top: 60px; height: calc(100vh - 60px); overflow-y: auto; }
    .sidebar::-webkit-scrollbar { width: 4px; }
    .sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
    .sidebar-section { padding: 0 1rem .5rem; font-family: 'Share Tech Mono', monospace; font-size: .65rem; color: var(--text-dim); letter-spacing: .12em; text-transform: uppercase; border-bottom: 1px solid var(--border); margin-bottom: .5rem; }
    .char-nav-item { display: flex; align-items: center; gap: .6rem; padding: .5rem 1rem; cursor: pointer; transition: background .15s; border-left: 3px solid transparent; font-family: 'Rajdhani', sans-serif; font-size: .95rem; font-weight: 600; letter-spacing: .04em; color: var(--text); }
    .char-nav-item:hover { background: var(--surface2); color: var(--text-bright); }
    .char-nav-item.active { border-left-color: var(--accent); background: rgba(245,196,0,.06); color: var(--accent); }
    .char-nav-item img { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; border: 1px solid var(--border); background: var(--surface2); flex-shrink: 0; }
    .nav-rank-badge { margin-left: auto; font-family: 'Share Tech Mono', monospace; font-size: .65rem; padding: .1rem .35rem; border-radius: 2px; background: rgba(245,196,0,.12); color: var(--rank-s); border: 1px solid rgba(245,196,0,.25); }
    main { flex: 1; padding: 2rem; overflow-y: auto; }
    .state-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 50vh; gap: 1rem; font-family: 'Share Tech Mono', monospace; color: var(--text-dim); }
    .state-screen .big-icon { font-size: 3rem; }
    .state-screen h2 { font-family: 'Rajdhani', sans-serif; font-size: 1.4rem; font-weight: 700; color: var(--text-bright); letter-spacing: .08em; }
    .spinner { width: 36px; height: 36px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .char-card { max-width: 960px; animation: fadeIn .3s ease; }
    @keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:none} }
    .char-header { display: flex; align-items: flex-start; gap: 1.5rem; padding: 1.5rem; background: var(--surface); border: 1px solid var(--border); border-bottom: 2px solid var(--accent); margin-bottom: 1.5rem; position: relative; overflow: hidden; }
    .char-header::before { content: ''; position: absolute; top: 0; right: 0; width: 300px; height: 100%; background: linear-gradient(90deg, transparent, rgba(245,196,0,.03)); pointer-events: none; }
    .char-avatar { width: 88px; height: 88px; border-radius: 4px; object-fit: cover; border: 2px solid var(--accent); background: var(--surface2); flex-shrink: 0; box-shadow: 0 0 20px rgba(245,196,0,.2); }
    .char-info { flex: 1; }
    .char-name { font-family: 'Rajdhani', sans-serif; font-size: 2rem; font-weight: 700; letter-spacing: .08em; color: var(--text-bright); text-shadow: 0 0 30px rgba(245,196,0,.15); line-height: 1; margin-bottom: .4rem; }
    .char-tags { display: flex; flex-wrap: wrap; gap: .4rem; margin-bottom: .8rem; }
    .tag { font-family: 'Share Tech Mono', monospace; font-size: .68rem; padding: .15rem .5rem; border-radius: 2px; letter-spacing: .06em; }
    .tag-faction  { background: rgba(0,212,255,.1); border: 1px solid rgba(0,212,255,.3); color: var(--accent3); }
    .tag-element  { background: rgba(255,107,26,.1); border: 1px solid rgba(255,107,26,.3); color: var(--accent2); }
    .tag-role     { background: rgba(245,196,0,.1);  border: 1px solid rgba(245,196,0,.3);  color: var(--accent); }
    .tag-rarity   { background: rgba(170,102,255,.1); border: 1px solid rgba(170,102,255,.3); color: var(--rank-a); }
    .char-score-big { display: flex; align-items: center; font-family: 'Rajdhani', sans-serif; font-size: 3rem; font-weight: 700; color: var(--accent); line-height: 1; gap: .3rem; align-self: center; text-shadow: 0 0 30px rgba(245,196,0,.5); flex-shrink: 0; }
    .char-score-big .score-label { font-size: .75rem; font-weight: 400; color: var(--text-dim); letter-spacing: .08em; align-self: flex-end; padding-bottom: .4rem; font-family: 'Share Tech Mono', monospace; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1.2rem; margin-bottom: 1.2rem; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1.2rem; margin-bottom: 1.2rem; }
    .span-2 { grid-column: span 2; }
    .panel { background: var(--surface); border: 1px solid var(--border); padding: 1.1rem 1.2rem; }
    .panel-title { font-family: 'Share Tech Mono', monospace; font-size: .68rem; letter-spacing: .12em; color: var(--accent); text-transform: uppercase; margin-bottom: .9rem; display: flex; align-items: center; gap: .5rem; }
    .panel-title::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, var(--border), transparent); }
    .rank-list { display: flex; flex-direction: column; gap: .65rem; }
    .rank-row { display: flex; align-items: center; gap: .75rem; }
    .rank-label { font-family: 'Barlow', sans-serif; font-size: .8rem; font-weight: 600; color: var(--text); width: 175px; flex-shrink: 0; letter-spacing: .02em; }
    .rank-bar-track { flex: 1; height: 6px; background: var(--surface2); border-radius: 3px; overflow: hidden; }
    .rank-bar-fill { height: 100%; border-radius: 3px; background: linear-gradient(90deg, var(--accent2), var(--accent)); transition: width .8s cubic-bezier(.25,.46,.45,.94); box-shadow: 0 0 6px rgba(245,196,0,.4); }
    .rank-value { font-family: 'Share Tech Mono', monospace; font-size: .75rem; color: var(--accent); width: 22px; text-align: right; flex-shrink: 0; }
    .rank-row.zero .rank-bar-fill { background: var(--border); box-shadow: none; }

    .info-val .reason { color: var(--text-dim); font-size: .82rem; font-weight: 300; display: block; margin-top: .1rem; }
    .weapon-chain { display: flex; align-items: center; flex-wrap: wrap; gap: .4rem; margin-top: .2rem; }
    .weapon-item { font-family: 'Rajdhani', sans-serif; font-size: .9rem; font-weight: 600; color: var(--text-bright); padding: .2rem .5rem; background: var(--surface2); border: 1px solid var(--border); border-radius: 2px; }
    .weapon-item.best { border-color: rgba(245,196,0,.4); color: var(--accent); background: rgba(245,196,0,.06); }
    .weapon-sep { color: var(--accent2); font-weight: 700; font-size: 1rem; }
    .disk-set { padding: .5rem .7rem; background: var(--surface2); border: 1px solid var(--border); border-radius: 2px; margin-bottom: .5rem; font-size: .85rem; display: flex; align-items: center; gap: .5rem; }
    .disk-set .rank-num { font-family: 'Share Tech Mono', monospace; font-size: .65rem; color: var(--accent); background: rgba(245,196,0,.1); padding: .1rem .3rem; border-radius: 2px; flex-shrink: 0; }
    .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: .5rem; margin-top: .2rem; }
    .stat-cell { background: var(--surface2); border: 1px solid var(--border); padding: .5rem .6rem; border-radius: 2px; }
    .stat-cell .slot-label { font-family: 'Share Tech Mono', monospace; font-size: .6rem; color: var(--accent2); letter-spacing: .08em; margin-bottom: .2rem; }
    .stat-cell .stat-name { font-size: .82rem; font-weight: 600; color: var(--text-bright); line-height: 1.3; }
    .substats-list { display: flex; flex-wrap: wrap; gap: .3rem; margin-top: .5rem; }
    .substat-chip { font-family: 'Share Tech Mono', monospace; font-size: .67rem; padding: .15rem .45rem; background: rgba(0,212,255,.06); border: 1px solid rgba(0,212,255,.2); color: var(--accent3); border-radius: 2px; }
    .stat-numbers { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: .5rem; margin-top: .2rem; }
    .stat-num-cell { background: var(--surface2); border: 1px solid var(--border); padding: .5rem .7rem; border-radius: 2px; }
    .stat-num-cell .sn-key { font-family: 'Share Tech Mono', monospace; font-size: .62rem; color: var(--text-dim); letter-spacing: .08em; margin-bottom: .15rem; }
    .stat-num-cell .sn-val { font-family: 'Rajdhani', sans-serif; font-size: 1.05rem; font-weight: 700; color: var(--text-bright); }
    .stat-num-cell.ideal .sn-val { color: var(--accent); text-shadow: 0 0 10px rgba(245,196,0,.3); }
    .tip-item { display: flex; gap: .65rem; padding: .55rem 0; border-bottom: 1px solid var(--border); font-size: .86rem; color: var(--text); line-height: 1.5; }
    .tip-item:last-child { border-bottom: none; }
    .tip-bullet { color: var(--accent2); font-family: 'Share Tech Mono', monospace; font-size: .8rem; flex-shrink: 0; margin-top: .05rem; }
    .empty-val { font-style: italic; color: var(--text-dim); font-size: .82rem; }
    .welcome { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 50vh; text-align: center; gap: 1rem; }
    .welcome-title { font-family: 'Rajdhani', sans-serif; font-size: 2.2rem; font-weight: 700; letter-spacing: .1em; color: var(--text-bright); }
    .welcome-title span { color: var(--accent); text-shadow: 0 0 20px rgba(245,196,0,.4); }
    .welcome-sub { color: var(--text-dim); font-family: 'Share Tech Mono', monospace; font-size: .8rem; letter-spacing: .05em; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-dim); }
    @media (max-width: 768px) {
      .sidebar {
        position: fixed;
        top: 60px;
        left: 0;
        width: 100%;
        height: calc(100vh - 60px);
        background: var(--surface);
        z-index: 1000;
        border-right: none;
        box-shadow: none;
        overflow-y: auto;
        padding: 1rem 0;
        display: none;
      }
      .sidebar.visible { display: block; }
      .sidebar-section, .char-nav-item { margin: 0 1rem; }
      .sidebar-section { padding: 0.8rem 0 0.4rem; }
      .sidebar .filter-options, .sidebar .filter-header, .sidebar .filter-content { margin: 0 1rem; }
      main { padding: 0.8rem; width: 100%; }
      .grid-2, .grid-3 { grid-template-columns: 1fr !important; gap: 0.8rem; }
      .char-card { margin: 0; }
      .char-header { flex-direction: column; align-items: center; text-align: center; padding: 1rem; }
      .char-avatar { width: 80px; height: 80px; }
      .char-name { font-size: 1.6rem; }
      .char-score-big { font-size: 2.2rem; margin-top: 0.5rem; }
      .char-tags { justify-content: center; }
      .panel { padding: 0.8rem; }
      .rank-row { gap: 0.5rem; flex-wrap: wrap; }
      .rank-label { width: 100%; font-size: 0.8rem; }
      .rank-bar-track { width: 100%; }

      .weapon-chain { flex-direction: column; align-items: flex-start; }
      .weapon-item { font-size: 0.8rem; width: 100%; text-align: center; }
      .weapon-sep { display: none; }
      .disk-set { font-size: 0.8rem; }
      .emoji-badge { font-size: 1.2rem; }
      .info-val { font-size: 0.85rem; }
      .tip-item { font-size: 0.8rem; }
      .char-nav-item { padding: 0.8rem 1rem; gap: 0.8rem; }
      .char-nav-item img { width: 40px; height: 40px; }

    }
    .emoji-badge { display: inline-block; transition: transform 0.1s; }
    .emoji-badge:hover { transform: scale(1.15); }
    @media (max-width: 768px) { .emoji-badge { font-size: 1.1rem; } }
    .char-avatar.rareza-a { border-color: #aa66ff; box-shadow: 0 0 12px rgba(170,102,255,0.5); }
    .char-avatar.rareza-s { border-color: #f5c400; box-shadow: 0 0 12px rgba(245,196,0,0.6); }
    .score-gris { color: #6c757d; text-shadow: none; }
    .score-verde { color: #28a745; text-shadow: 0 0 6px rgba(40,167,69,0.3); }
    .score-morado { color: #aa66ff; text-shadow: 0 0 6px rgba(170,102,255,0.3); }
    .score-dorado { color: #f5c400; text-shadow: 0 0 6px rgba(245,196,0,0.3); }
    .score-celeste { color: #00d4ff; text-shadow: 0 0 6px rgba(0,212,255,0.3); }
    .score-multicolor { background: linear-gradient(90deg, #f5c400, #ff6b1a, #00d4ff, #aa66ff); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: none; }
    .info-icon { display: inline-block; width: 16px; height: 16px; background: rgba(0,212,255,0.2); color: var(--accent3); border-radius: 50%; text-align: center; line-height: 16px; font-size: 11px; font-weight: bold; cursor: help; margin-left: 0.3rem; transition: all 0.2s; }
    .info-icon:hover { background: var(--accent3); color: var(--bg); transform: scale(1.1); }

<script>
// ══════════════════════════════════════════════════════════
// CONFIGURACIÓN
// ══════════════════════════════════════════════════════════
const wikiContainer = document.getElementById('wiki-container');
const tierListContainer = document.getElementById('tierlist-container');
const filtersContainer = document.getElementById('filters-container');
const navContainer = document.getElementById('nav-container');

const SHEET_CHARS = 'Zenless Builds';
const SHEET_BANGBOOS = 'Zenless Bangboos';
const SHEET_ID = '1hvggH2H5F27AyvaQnZs9CAPu6V78TZBa2SKq445Jad8';

const EXPECTED_KEYS = [
  'nombre','imagen','faccion','elemento','rol','rareza',
  'sc_utilidad','sc_facilidad_build','sc_build_value','sc_pull_value',
  'sc_gameplay','sc_f2p_friendly','sc_consistencia',
  'nec_arma','nec_dupes','mejores_dupes','mejores_compas','mejor_bangbu',
  'w_engines','sets_discos','disco_slot4','disco_slot5','disco_slot6',
  'disco_sub','stats_basicas','stats_ideales','consejos','resumen'
];

const EXPECTED_KEYS_BANGBOOS = [
  'nombre','rango','elemento','especializacion',
  'sc_dano','sc_aturdimiento','sc_utilidad','sc_uso','sc_mejora',
  'personajes_recomendados'
];

const SCORE_LABELS = {
  sc_utilidad:'Utilidad', sc_facilidad_build:'Facilidad de Buildeo',
  sc_build_value:'Build Value', sc_pull_value:'Pull Value',
  sc_gameplay:'Facilidad de Gameplay', sc_f2p_friendly:'F2P Friendly',
  sc_consistencia:'Consistencia'
};
const SCORE_TOOLTIPS = {
  sc_utilidad:'Qué tan útil es hoy en día el personaje, qué tanto te ayuda en el juego en general.',
  sc_facilidad_build:'Qué fácil es llegar a unas estadísticas para que el personaje cumpla su función.',
  sc_build_value:'Qué tanto vale la pena sobreinvertir en este personaje.',
  sc_pull_value:'Qué tanto vale la pena tirar por este personaje (o sus dupes si es regalado).',
  sc_gameplay:'Qué tan fácil es dominar su gameplay para sacar puntuaciones decentes.',
  sc_f2p_friendly:'Qué tan amigable es con cuentas con pocas armas rango S, pocos personajes rango S y casi sin dupes.',
  sc_consistencia:'Qué tan consistente es en sus rotaciones y si se basa mucho en RNG o situaciones específicas para brillar.'
};

const SCORE_LABELS_BANGBOOS = {
  sc_dano:'Daño', sc_aturdimiento:'Aturdimiento', sc_utilidad:'Utilidad',
  sc_uso:'Uso', sc_mejora:'Mejora'
};
const SCORE_TOOLTIPS_BANGBOOS = {
  sc_dano:'Qué tanto daño hace en combate.',
  sc_aturdimiento:'Qué tanto ayuda a aturdir al enemigo.',
  sc_utilidad:'Si otorga algo extra al equipo (buffos, cura, etc.).',
  sc_uso:'Si actualmente en el meta combina con los personajes más fuertes.',
  sc_mejora:'Qué tanto mejora con sus Dupes.'
};

const NEC_LEVELS = ['Nada','Poca','Media','Mucha','Obligatoria'];
const EMOJI_DESCRIPTIONS = {
  '💔':'Reduce defensas/resistencias','📈':'Amplifica daño equipo','💉':'Cura aliados',
  '🛡️':'Otorga escudos','⛓️':'Potencia ataques cadena','✨':'Ultimates adicionales',
  '🎯':'Daño extra','⚡':'Energía extra','🌀':'Ataca fuera campo','🌸':'Bloom',
  '🌪️':'Disorder','💥':'Totalize','💀':'Alto daño Ultimate','🔗':'Alto daño cadena',
  '⚙️':'Alto daño EX','🗡️':'Alto daño básico','⏳':'Mucho tiempo campo','🔁':'Poco tiempo campo',
  '🤺':'Parrys','⚔️':'Escala ATK','❤️':'Escala VIDA','🔰':'Escala DEF',
  '🌡️':'Escala Maestría','🎲':'Escala Probabilidad','🔋':'Escala Energía'
};

// ══════════════════════════════════════════════════════════
// ESTADO GLOBAL
// ══════════════════════════════════════════════════════════
let allChars = [];
let allBangboos = [];
let activeCharIdx = -1;
let activeBangbooIdx = -1;
let currentSection = 'home';
let charSearchTerm = '';
let bangbooSearchTerm = '';
let selectedCharElements = new Set(), selectedCharRarities = new Set(), selectedCharRoles = new Set();
let selectedBangbooRarities = new Set(), selectedBangbooElements = new Set(), selectedBangbooSpecs = new Set();

// ══════════════════════════════════════════════════════════
// FUNCIONES GENERICAS DE CARGA
// ══════════════════════════════════════════════════════════
async function fetchSheetData(sheetName) {
  const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(sheetName)}`;
  const resp = await fetch(url);
  if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
  const csvText = await resp.text();
  const rows = [];
  const lines = csvText.split(/\r?\n/);
  for (const line of lines) {
    if (line.trim() === '') continue;
    const cells = [];
    let inQuote = false, current = '';
    for (let i = 0; i < line.length; i++) {
      const ch = line[i];
      if (ch === '"') inQuote = !inQuote;
      else if (ch === ',' && !inQuote) { cells.push(current.trim()); current = ''; }
      else current += ch;
    }
    cells.push(current.trim());
    rows.push(cells);
  }
  return rows;
}

function buildCharacters(rows) {
  if (rows.length < 2) return [];
  const headers = rows[0];
  const colIndexToKey = {};
  for (let i = 0; i < headers.length; i++) {
    const header = headers[i] ? headers[i].toLowerCase().trim() : '';
    if (EXPECTED_KEYS.includes(header)) colIndexToKey[i] = header;
  }
  const nombreIndex = Object.keys(colIndexToKey).find(idx => colIndexToKey[idx] === 'nombre');
  if (nombreIndex === undefined) throw new Error('No se encontró la columna "nombre"');
  const chars = [];
  for (let i = 1; i < rows.length; i++) {
    const row = rows[i];
    if (!row || row.length === 0) continue;
    const obj = {};
    for (const colIdx in colIndexToKey) {
      let value = row[colIdx] !== undefined ? row[colIdx] : '';
      value = value.replace(/^"|"$/g, '');
      obj[colIndexToKey[colIdx]] = value;
    }
    if (obj.nombre && obj.nombre.trim() !== '') chars.push(obj);
  }
  return chars;
}

function buildBangboos(rows) {
  if (rows.length < 2) return [];
  const headers = rows[0];
  const colIndexToKey = {};
  for (let i = 0; i < headers.length; i++) {
    const header = headers[i] ? headers[i].toLowerCase().trim() : '';
    if (EXPECTED_KEYS_BANGBOOS.includes(header)) colIndexToKey[i] = header;
  }
  const nombreIndex = Object.keys(colIndexToKey).find(idx => colIndexToKey[idx] === 'nombre');
  if (nombreIndex === undefined) throw new Error('No se encontró la columna "nombre" en Bangboos');
  const bangboos = [];
  for (let i = 1; i < rows.length; i++) {
    const row = rows[i];
    if (!row || row.length === 0) continue;
    const obj = {};
    for (const colIdx in colIndexToKey) {
      let value = row[colIdx] !== undefined ? row[colIdx] : '';
      value = value.replace(/^"|"$/g, '');
      obj[colIndexToKey[colIdx]] = value;
    }
    if (obj.nombre && obj.nombre.trim() !== '') bangboos.push(obj);
  }
  return bangboos;
}

// ══════════════════════════════════════════════════════════
// UTILIDADES GENERALES
// ══════════════════════════════════════════════════════════
function calcPromedio(char, scoreKeys) {
  let total = 0, count = 0;
  for (const key of scoreKeys) {
    const val = parseFloat(char[key]);
    if (!isNaN(val) && val > 0) { total += val; count++; }
  }
  return count === 0 ? null : (total / count).toFixed(1);
}

function getScoreClass(avg, maxScore = 10) {
  if (avg === null) return '';
  const num = parseFloat(avg);
  if (num < 3) return 'score-gris';
  if (num < 5) return 'score-verde';
  if (num < 7) return 'score-morado';
  if (num < 8) return 'score-dorado';
  if (num < 9) return 'score-celeste';
  return 'score-multicolor';
}

function necClass(val) {
  const idx = NEC_LEVELS.findIndex(n => n.toLowerCase() === val.toLowerCase().trim());
  if (idx < 0) return 'nec-0';
  return `nec-${idx+1}`;
}

function splitPipe(str) {
  if (!str) return [];
  return str.split('|').map(s => s.trim()).filter(Boolean);
}

function isImageUrl(str) {
  if (!str) return false;
  str = str.trim();
  if (!str.startsWith('http')) return false;
  const imageExtensions = /\.(png|jpg|jpeg|gif|webp|svg|bmp|ico)(\?.*)?$/i;
  if (imageExtensions.test(str)) return true;
  const imageDomains = /(wikia|nocookie|gg|drive\.google\.com|googleusercontent|imgur|ibb\.co|cdn\.discordapp|github\.io)/i;
  if (imageDomains.test(str)) return true;
  if (str.includes('/image/') || str.includes('img=')) return true;
  if (str.includes('drive.google.com')) return true;
  return false;
}

function renderEmojis(str) {
  if (!str) return '';
  const emojis = str.split(/\s+/).filter(e => e.trim().length > 0);
  return emojis.map(emoji => {
    const desc = EMOJI_DESCRIPTIONS[emoji] || 'Sin descripción';
    return `<span class="emoji-badge" data-desc="${desc.replace(/"/g,'&quot;')}" style="cursor:pointer;font-size:1.3rem;margin-right:0.3rem;">${emoji}</span>`;
  }).join('');
}

// ══════════════════════════════════════════════════════════
// RENDER PARA PERSONAJES (char)
// ══════════════════════════════════════════════════════════
function renderCharFilters() {
  const elements = [...new Set(allChars.map(c=>c.elemento).filter(Boolean))];
  const rarities = [...new Set(allChars.map(c=>c.rareza).filter(Boolean))];
  const roles = [...new Set(allChars.map(c=>c.rol).filter(Boolean))];
  let html = '';
  const renderGroup = (title, items, selectedSet, className) => {
    if (!items.length) return '';
    let gh = `<div class="filter-accordion"><div class="filter-header" data-group="${className}"><span>${title}</span><span class="accordion-icon">▼</span></div><div class="filter-content" id="filter-${className}"><div class="filter-options">`;
    items.forEach(item => gh += `<label><input type="checkbox" value="${item}" class="filter-${className}" ${selectedSet.has(item)?'checked':''}> ${item}</label>`);
    gh += `</div></div></div>`;
    return gh;
  };
  html += renderGroup('Elemento', elements, selectedCharElements, 'element');
  html += renderGroup('Rango', rarities, selectedCharRarities, 'rarity');
  html += renderGroup('Rol', roles, selectedCharRoles, 'role');
  filtersContainer.innerHTML = html;
  document.querySelectorAll('.filter-element').forEach(cb => cb.addEventListener('change', ()=>{
    cb.checked ? selectedCharElements.add(cb.value) : selectedCharElements.delete(cb.value);
    updateCharList();
  }));
  document.querySelectorAll('.filter-rarity').forEach(cb => cb.addEventListener('change', ()=>{
    cb.checked ? selectedCharRarities.add(cb.value) : selectedCharRarities.delete(cb.value);
    updateCharList();
  }));
  document.querySelectorAll('.filter-role').forEach(cb => cb.addEventListener('change', ()=>{
    cb.checked ? selectedCharRoles.add(cb.value) : selectedCharRoles.delete(cb.value);
    updateCharList();
  }));
  document.querySelectorAll('.filter-header').forEach(header => {
    const group = header.dataset.group, content = document.getElementById(`filter-${group}`), icon = header.querySelector('.accordion-icon');
    content.classList.remove('open'); icon.classList.remove('open');
    header.addEventListener('click', e => { e.stopPropagation(); content.classList.toggle('open'); icon.classList.toggle('open'); });
  });
}

function renderCharNav(chars) {
  navContainer.innerHTML = '<div class="sidebar-section">Personajes</div>';
  const div = document.createElement('div');
  div.id = 'char-nav';
  navContainer.appendChild(div);
  chars.forEach((c,i) => {
    const avg = calcPromedio(c, Object.keys(SCORE_LABELS));
    const rarezaClass = c.rareza ? `rareza-${c.rareza.toLowerCase()}` : '';
    const item = document.createElement('div');
    item.className = 'char-nav-item' + (allChars.indexOf(c) === activeCharIdx ? ' active' : '');
    item.innerHTML = `<img src="${c.imagen||''}" alt="${c.nombre}" class="char-avatar ${rarezaClass}" onerror="this.style.display='none'"><span>${c.nombre}</span>${avg ? `<span class="nav-rank-badge ${getScoreClass(avg)}">${avg}</span>` : ''}`;
    item.addEventListener('click', ()=>selectChar(allChars.indexOf(c)));
    div.appendChild(item);
  });
}

function filterChars() {
  return allChars.filter(c => {
    if (charSearchTerm && !c.nombre.toLowerCase().includes(charSearchTerm)) return false;
    if (selectedCharElements.size && !selectedCharElements.has(c.elemento)) return false;
    if (selectedCharRarities.size && !selectedCharRarities.has(c.rareza)) return false;
    if (selectedCharRoles.size && !selectedCharRoles.has(c.rol)) return false;
    return true;
  });
}

function updateCharList() {
  const filtered = filterChars();
  renderCharNav(filtered);
  if (activeCharIdx !== -1 && !filtered.includes(allChars[activeCharIdx])) {
    if (filtered.length > 0) { selectChar(allChars.indexOf(filtered[0])); }
    else { activeCharIdx = -1; renderWelcome('personajes'); }
  }
}

function selectChar(idx) {
  if (idx < 0 || idx >= allChars.length) return;
  activeCharIdx = idx;
  const filtered = filterChars();
  renderCharNav(filtered);
  renderCharCard(allChars[idx]);
  if (window.innerWidth <= 768) document.getElementById('sidebar').style.display = 'none';
}

function renderCharCard(c) {
  const avg = calcPromedio(c, Object.keys(SCORE_LABELS));
  const scoreRows = Object.entries(SCORE_LABELS).map(([key,label]) => {
    let val = parseFloat(c[key]) || 0;
    const pct = (val/10)*100;
    const tip = SCORE_TOOLTIPS[key] || '';
    return `<div class="rank-row ${val===0?'zero':''}"><div class="rank-label">${label}<span class="info-icon" data-tip="${tip.replace(/"/g,'&quot;')}">ⓘ</span></div><div class="rank-bar-track"><div class="rank-bar-fill" style="width:${pct}%"></div></div><div class="rank-value">${val>0?val:'—'}</div></div>`;
  }).join('');
  const engines = c.w_engines ? c.w_engines.split('>').map(s=>s.trim()).filter(Boolean) : [];
  const engineHTML = engines.length ? engines.map((e,i)=>isImageUrl(e)?`<img src="${e}" data-text="${e.replace(/"/g,'&quot;')}" style="width:48px;height:48px;border-radius:8px;border:${i===0?'2px solid var(--accent)':'1px solid var(--border)'};margin:0.2rem;background:var(--surface2);cursor:pointer;" onerror="this.onerror=null;this.outerHTML='<span class=\\'weapon-item ${i===0?'best':''}\\'>'+this.getAttribute('data-text')+'</span>'+( ${i<engines.length-1} ? '<span class=\\'weapon-sep\\'>›</span>' : '');">`:`<span class="weapon-item ${i===0?'best':''}">${e}</span>${i<engines.length-1?'<span class="weapon-sep">›</span>':''}`).join('') : '<span class="empty-val">Sin datos</span>';
  const setsRaw = (c.sets_discos||'').split('>').map(s=>s.trim()).filter(Boolean);
  const setsHTML = setsRaw.length ? setsRaw.map((block,idx)=>{
    let parts=[], rem=block;
    const m4=rem.match(/^(\d+)\s+(.+?)(?=\s+\d+\s+|$)/);
    if(m4){ parts.push({count:m4[1], content:m4[2].trim()}); rem=rem.substring(m4[0].length).trim(); const m2=rem.match(/^(\d+)\s+(.+)$/); if(m2) parts.push({count:m2[1], content:m2[2].trim()}); }
    else parts.push({count:(idx+1).toString(), content:block});
    const phtml = parts.map(p=>{
      if(isImageUrl(p.content)){
        return `<div style="display:flex;flex-direction:column;align-items:center;"><img src="${p.content}" style="width:48px;height:48px;border-radius:8px;border:1px solid var(--border);background:var(--surface2);" onerror="this.onerror=null;this.outerHTML='<span>'+this.getAttribute('data-text')+'</span>';" data-text="${p.content.replace(/"/g,'&quot;')}"><span style="font-size:0.65rem;margin-top:0.2rem;">${p.count}p</span></div>`;
      }
      return `<span class="rank-num">${p.count}</span><span>${p.content}</span>`;
    }).join('');
    return `<div class="disk-set" style="display:flex;gap:1rem;align-items:center;justify-content:space-around;">${phtml}</div>`;
  }).join('') : '<span class="empty-val">Sin datos</span>';
  const rawCompanions = c.mejores_compas ? c.mejores_compas.split('|').map(s=>s.trim()).filter(Boolean) : [];
  const compasHTML = rawCompanions.length ? rawCompanions.map(chain=>{
    const opts = chain.split('>').map(s=>s.trim()).filter(Boolean);
    const optsHtml = opts.map(opt=>{
      let name=opt, reason='';
      if(!isImageUrl(name)){ const h=name.indexOf('-'); if(h!==-1){ reason=name.substring(h+1).trim(); name=name.substring(0,h).trim(); } }
      let img='', display=name;
      if(isImageUrl(name)){ img=`<img src="${name}" style="width:40px;height:40px;border-radius:50%;border:2px solid var(--accent);margin-right:0.3rem;" onerror="this.onerror=null;this.outerHTML='<span>'+this.getAttribute('data-text')+'</span>';" data-text="${name.replace(/"/g,'&quot;')}">`; display=''; }
      return `<span style="display:inline-flex;align-items:center;gap:0.2rem;">${img}<span>${display}${display&&reason?' ':''}<span class="reason">${reason}</span></span></span>`;
    }).join(' <span style="color:var(--accent2);font-weight:bold;">→</span> ');
    return `<div class="info-row"><div class="info-val" style="display:flex;align-items:center;gap:0.5rem;flex-wrap:wrap;">${optsHtml}</div></div>`;
  }).join('') : '<div class="info-row"><div class="info-val empty-val">Sin datos</div></div>';
  const rawBangbus = c.mejor_bangbu ? c.mejor_bangbu.split('|').map(s=>s.trim()).filter(Boolean) : [];
  const bangbuHTML = rawBangbus.length ? rawBangbus.map(chain=>{
    const opts = chain.split('>').map(s=>s.trim()).filter(Boolean);
    const optsHtml = opts.map(opt=>{
      let name=opt, reason='';
      if(!isImageUrl(name)){ const h=name.indexOf('-'); if(h!==-1){ reason=name.substring(h+1).trim(); name=name.substring(0,h).trim(); } }
      let img='', display=name;
      if(isImageUrl(name)){ img=`<img src="${name}" style="width:40px;height:40px;border-radius:50%;border:2px solid var(--accent);margin-right:0.3rem;" onerror="this.onerror=null;this.outerHTML='<span>'+this.getAttribute('data-text')+'</span>';" data-text="${name.replace(/"/g,'&quot;')}">`; display=''; }
      return `<span style="display:inline-flex;align-items:center;gap:0.2rem;">${img}<span>${display}${display&&reason?' ':''}<span class="reason">${reason}</span></span></span>`;
    }).join(' <span style="color:var(--accent2);font-weight:bold;">→</span> ');
    return `<div class="info-row"><div class="info-val" style="display:flex;align-items:center;gap:0.5rem;flex-wrap:wrap;">${optsHtml}</div></div>`;
  }).join('') : '<div class="info-row"><div class="info-val empty-val">Sin datos</div></div>';
  const dupes = splitPipe(c.mejores_dupes).map(d=>`<div class="dupe-item">${d}</div>`).join('') || '<span class="empty-val">Sin datos</span>';
  const renderStats = (str, ideal) => {
    const items = splitPipe(str);
    if(!items.length) return '<span class="empty-val">Sin datos</span>';
    return `<div class="stat-numbers">`+items.map(s=>{const [k,v]=s.split(':'); return `<div class="stat-num-cell ${ideal?'ideal':''}"><div class="sn-key">${(k||'').trim()}</div><div class="sn-val">${(v||'').trim()}</div></div>`;}).join('')+'</div>';
  };
  const tips = splitPipe(c.consejos).map(t=>`<div class="tip-item"><span class="tip-bullet">◆</span><span>${t}</span></div>`).join('') || '<div class="tip-item"><span class="tip-bullet">◆</span><span class="empty-val">Sin datos</span></div>';
  const subs = (c.disco_sub||'').split(',').map(s=>s.trim()).filter(Boolean);
  const subsHTML = subs.length ? `<div class="substats-list">${subs.map(s=>`<span class="substat-chip">${s}</span>`).join('')}</div>` : '';
  const tags = [c.rareza&&`<span class="tag tag-rarity">${c.rareza}</span>`, c.elemento&&`<span class="tag tag-element">${c.elemento}</span>`, c.rol&&`<span class="tag tag-role">${c.rol}</span>`, c.faccion&&`<span class="tag tag-faction">${c.faccion}</span>`].filter(Boolean).join('');
  const rarezaClass = c.rareza ? `rareza-${c.rareza.toLowerCase()}` : '';
  wikiContainer.innerHTML = `
  <div class="char-card">
    <div class="char-header">
      <img class="char-avatar ${rarezaClass}" src="${c.imagen||''}" alt="${c.nombre}" onerror="this.style.display='none'">
      <div class="char-info">
        <div class="char-name">${c.nombre}</div>
        <div class="char-emojis" style="margin:0.3rem 0;">${renderEmojis(c.resumen)}</div>
        <div class="char-tags">${tags}</div>
      </div>
      ${avg ? `<div class="char-score-big ${getScoreClass(avg)}">${avg}<div class="score-label">/ 10</div></div>` : ''}
    </div>
    <div class="grid-2">
      <div class="panel"><div class="panel-title">Puntuaciones</div><div class="rank-list">${scoreRows}</div></div>
      <div class="panel">
        <div class="panel-title">Necesidades</div>
        <div class="info-row"><div class="info-key">W-Engine</div><div class="info-val"><span class="necessity ${necClass(c.nec_arma||'nada')}">${c.nec_arma||'—'}</span></div></div>
        <div class="info-row"><div class="info-key">Dupes</div><div class="info-val"><span class="necessity ${necClass(c.nec_dupes||'nada')}">${c.nec_dupes||'—'}</span></div></div>
        <br><div class="panel-title">Mejores Dupes</div>${dupes}
      </div>
    </div>
    <div class="grid-2">
      <div class="panel"><div class="panel-title">Mejores Compañeros</div>${compasHTML}</div>
      <div class="panel"><div class="panel-title">Mejor Bangbú</div>${bangbuHTML}</div>
    </div>
    <div class="grid-2">
      <div class="panel"><div class="panel-title">W-Engines</div><div class="weapon-chain">${engineHTML}</div></div>
      <div class="panel"><div class="panel-title">Sets de Discos</div>${setsHTML}</div>
    </div>
    <div class="panel" style="margin-bottom:1.2rem">
      <div class="panel-title">Stats de Discos</div>
      <div class="stats-grid">
        <div class="stat-cell"><div class="slot-label">SLOT 4</div><div class="stat-name">${c.disco_slot4||'—'}</div></div>
        <div class="stat-cell"><div class="slot-label">SLOT 5</div><div class="stat-name">${c.disco_slot5||'—'}</div></div>
        <div class="stat-cell"><div class="slot-label">SLOT 6</div><div class="stat-name">${c.disco_slot6||'—'}</div></div>
      </div>
      ${subsHTML ? `<div style="margin-top:.75rem"><div class="info-key" style="margin-bottom:.3rem">SUBSTATS</div>${subsHTML}</div>` : ''}
    </div>
    <div class="grid-2">
      <div class="panel"><div class="panel-title">Stats Básicas</div>${renderStats(c.stats_basicas,false)}</div>
      <div class="panel"><div class="panel-title">Stats Ideales</div>${renderStats(c.stats_ideales,true)}</div>
    </div>
    <div class="panel" style="margin-bottom:2rem"><div class="panel-title">Consejos</div>${tips}</div>
  </div>`;
  requestAnimationFrame(()=>document.querySelectorAll('.rank-bar-fill').forEach(el=>{ let w=el.style.width; el.style.width='0'; requestAnimationFrame(()=>{el.style.width=w;}); }));
}

// ══════════════════════════════════════════════════════════
// RENDER PARA BANGBOOS
// ══════════════════════════════════════════════════════════
function renderBangbooFilters() {
  const rarities = [...new Set(allBangboos.map(b=>b.rango).filter(Boolean))];
  const elements = [...new Set(allBangboos.map(b=>b.elemento).filter(Boolean))];
  const specs = [...new Set(allBangboos.map(b=>b.especializacion).filter(Boolean))];
  let html = '';
  const renderGroup = (title, items, selectedSet, className) => {
    if (!items.length) return '';
    let gh = `<div class="filter-accordion"><div class="filter-header" data-group="${className}"><span>${title}</span><span class="accordion-icon">▼</span></div><div class="filter-content" id="filter-${className}"><div class="filter-options">`;
    items.forEach(item => gh += `<label><input type="checkbox" value="${item}" class="filter-${className}" ${selectedSet.has(item)?'checked':''}> ${item}</label>`);
    gh += `</div></div></div>`;
    return gh;
  };
  html += renderGroup('Rango', rarities, selectedBangbooRarities, 'b-rarity');
  html += renderGroup('Elemento', elements, selectedBangbooElements, 'b-element');
  html += renderGroup('Especialización', specs, selectedBangbooSpecs, 'b-spec');
  filtersContainer.innerHTML = html;
  document.querySelectorAll('.filter-b-rarity').forEach(cb => cb.addEventListener('change', ()=>{
    cb.checked ? selectedBangbooRarities.add(cb.value) : selectedBangbooRarities.delete(cb.value);
    updateBangbooList();
  }));
  document.querySelectorAll('.filter-b-element').forEach(cb => cb.addEventListener('change', ()=>{
    cb.checked ? selectedBangbooElements.add(cb.value) : selectedBangbooElements.delete(cb.value);
    updateBangbooList();
  }));
  document.querySelectorAll('.filter-b-spec').forEach(cb => cb.addEventListener('change', ()=>{
    cb.checked ? selectedBangbooSpecs.add(cb.value) : selectedBangbooSpecs.delete(cb.value);
    updateBangbooList();
  }));
  document.querySelectorAll('.filter-header').forEach(header => {
    const group = header.dataset.group, content = document.getElementById(`filter-${group}`), icon = header.querySelector('.accordion-icon');
    content.classList.remove('open'); icon.classList.remove('open');
    header.addEventListener('click', e => { e.stopPropagation(); content.classList.toggle('open'); icon.classList.toggle('open'); });
  });
}

function renderBangbooNav(bangboos) {
  navContainer.innerHTML = '<div class="sidebar-section">Bangboos</div>';
  const div = document.createElement('div');
  div.id = 'bangboo-nav';
  navContainer.appendChild(div);
  bangboos.forEach((b,i) => {
    const avg = calcPromedio(b, Object.keys(SCORE_LABELS_BANGBOOS));
    const rarezaClass = b.rango ? `rareza-${b.rango.toLowerCase()}` : '';
    const item = document.createElement('div');
    item.className = 'char-nav-item' + (allBangboos.indexOf(b) === activeBangbooIdx ? ' active' : '');
    // Imagen no tenemos, usamos placeholder o iniciales
    const imgSrc = b.imagen || ''; // si no hay imagen, usamos un placeholder con iniciales
    item.innerHTML = `<img src="${imgSrc}" alt="${b.nombre}" class="char-avatar ${rarezaClass}" onerror="this.style.display='none'"><span>${b.nombre}</span>${avg ? `<span class="nav-rank-badge ${getScoreClass(avg,5)}">${avg}</span>` : ''}`;
    item.addEventListener('click', ()=>selectBangboo(allBangboos.indexOf(b)));
    div.appendChild(item);
  });
}

function filterBangboos() {
  return allBangboos.filter(b => {
    if (bangbooSearchTerm && !b.nombre.toLowerCase().includes(bangbooSearchTerm)) return false;
    if (selectedBangbooRarities.size && !selectedBangbooRarities.has(b.rango)) return false;
    if (selectedBangbooElements.size && !selectedBangbooElements.has(b.elemento)) return false;
    if (selectedBangbooSpecs.size && !selectedBangbooSpecs.has(b.especializacion)) return false;
    return true;
  });
}

function updateBangbooList() {
  const filtered = filterBangboos();
  renderBangbooNav(filtered);
  if (activeBangbooIdx !== -1 && !filtered.includes(allBangboos[activeBangbooIdx])) {
    if (filtered.length > 0) { selectBangboo(allBangboos.indexOf(filtered[0])); }
    else { activeBangbooIdx = -1; renderWelcome('bangboos'); }
  }
}

function selectBangboo(idx) {
  if (idx < 0 || idx >= allBangboos.length) return;
  activeBangbooIdx = idx;
  const filtered = filterBangboos();
  renderBangbooNav(filtered);
  renderBangbooCard(allBangboos[idx]);
  if (window.innerWidth <= 768) document.getElementById('sidebar').style.display = 'none';
}

function renderBangbooCard(b) {
  const avg = calcPromedio(b, Object.keys(SCORE_LABELS_BANGBOOS));
  const scoreRows = Object.entries(SCORE_LABELS_BANGBOOS).map(([key,label]) => {
    let val = parseFloat(b[key]) || 0;
    const pct = (val/5)*100;
    const tip = SCORE_TOOLTIPS_BANGBOOS[key] || '';
    return `<div class="rank-row ${val===0?'zero':''}"><div class="rank-label">${label}<span class="info-icon" data-tip="${tip.replace(/"/g,'&quot;')}">ⓘ</span></div><div class="rank-bar-track"><div class="rank-bar-fill" style="width:${pct}%"></div></div><div class="rank-value">${val>0?val:'—'}</div></div>`;
  }).join('');
  // Personajes recomendados
  const rawRecs = b.personajes_recomendados ? b.personajes_recomendados.split('|').map(s=>s.trim()).filter(Boolean) : [];
  const recsHTML = rawRecs.length ? rawRecs.map(chain => {
    const opts = chain.split('>').map(s=>s.trim()).filter(Boolean);
    const optsHtml = opts.map(opt => {
      if (isImageUrl(opt)) {
        return `<img src="${opt}" style="width:40px;height:40px;border-radius:50%;border:2px solid var(--accent);margin:0.2rem;" onerror="this.onerror=null;this.outerHTML='<span>'+this.getAttribute('data-text')+'</span>';" data-text="${opt.replace(/"/g,'&quot;')}" title="Personaje recomendado">`;
      }
      return `<span>${opt}</span>`;
    }).join(' <span style="color:var(--accent2);font-weight:bold;">→</span> ');
    return `<div class="info-row"><div class="info-val" style="display:flex;align-items:center;gap:0.5rem;flex-wrap:wrap;">${optsHtml}</div></div>`;
  }).join('') : '<div class="info-row"><div class="info-val empty-val">Sin personajes recomendados</div></div>';
  const tags = [
    b.rango && `<span class="tag tag-rarity">${b.rango}</span>`,
    b.elemento && `<span class="tag tag-element">${b.elemento}</span>`,
    b.especializacion && `<span class="tag tag-role">${b.especializacion}</span>`
  ].filter(Boolean).join('');
  const rarezaClass = b.rango ? `rareza-${b.rango.toLowerCase()}` : '';
  wikiContainer.innerHTML = `
  <div class="char-card">
    <div class="char-header">
      <img class="char-avatar ${rarezaClass}" src="" alt="${b.nombre}" onerror="this.style.display='none'">
      <div class="char-info">
        <div class="char-name">${b.nombre}</div>
        <div class="char-tags">${tags}</div>
      </div>
      ${avg ? `<div class="char-score-big ${getScoreClass(avg,5)}">${avg}<div class="score-label">/ 5</div></div>` : ''}
    </div>
    <div class="grid-2">
      <div class="panel"><div class="panel-title">Puntuaciones</div><div class="rank-list">${scoreRows}</div></div>
    </div>
    <div class="panel" style="margin-bottom:1.2rem">
      <div class="panel-title">Personajes recomendados</div>
      ${recsHTML}
    </div>
  </div>`;
  requestAnimationFrame(()=>document.querySelectorAll('.rank-bar-fill').forEach(el=>{ let w=el.style.width; el.style.width='0'; requestAnimationFrame(()=>{el.style.width=w;}); }));
}

// ══════════════════════════════════════════════════════════
// SECCIONES Y NAVEGACIÓN
// ══════════════════════════════════════════════════════════
function renderWelcome(section) {
  const titles = { personajes:'ZENLESS ZONE ZERO', bangboos:'BANGBOOS', home:'ZENLESS ZONE ZERO' };
  const sub = { personajes:'Seleccioná un personaje en el panel izquierdo', bangboos:'Seleccioná un Bangboo en el panel izquierdo', home:'Bienvenido a la página principal de ZZZ' };
  wikiContainer.innerHTML = `<div class="welcome"><div class="welcome-title">${titles[section]||'ZENLESS ZONE ZERO'}</div><div class="welcome-sub">${sub[section]||''}</div></div>`;
}

function showSection(section) {
  currentSection = section;
  document.querySelectorAll('.section-tab').forEach(btn => btn.classList.toggle('active', btn.dataset.section === section));
  const sidebar = document.getElementById('sidebar');
  if (section === 'home' || section === 'tierlist') {
    sidebar.style.display = 'none';
    wikiContainer.style.display = 'block';
    tierListContainer.style.display = 'none';
    if (section === 'home') renderWelcome('home');
    else if (section === 'tierlist') showTierList();
  } else if (section === 'characters') {
    sidebar.style.display = 'block';
    if (window.innerWidth <= 768) sidebar.classList.add('visible');
    wikiContainer.style.display = 'block';
    tierListContainer.style.display = 'none';
    renderCharFilters();
    const filtered = filterChars();
    renderCharNav(filtered);
    if (activeCharIdx !== -1 && filtered.includes(allChars[activeCharIdx])) renderCharCard(allChars[activeCharIdx]);
    else if (filtered.length > 0) selectChar(allChars.indexOf(filtered[0]));
    else renderWelcome('personajes');
  } else if (section === 'bangboos') {
    sidebar.style.display = 'block';
    if (window.innerWidth <= 768) sidebar.classList.add('visible');
    wikiContainer.style.display = 'block';
    tierListContainer.style.display = 'none';
    renderBangbooFilters();
    const filtered = filterBangboos();
    renderBangbooNav(filtered);
    if (activeBangbooIdx !== -1 && filtered.includes(allBangboos[activeBangbooIdx])) renderBangbooCard(allBangboos[activeBangbooIdx]);
    else if (filtered.length > 0) selectBangboo(allBangboos.indexOf(filtered[0]));
    else renderWelcome('bangboos');
  }
}

function showTierList() {
  // Tier list ya implementada; no la modificamos
  // Solo mostramos el contenedor
  wikiContainer.style.display = 'none';
  tierListContainer.style.display = 'block';
  document.getElementById('sidebar').style.display = 'none';
  // Si no se ha generado, la generamos (usamos la función existente)
  if (!tierListContainer.innerHTML || tierListContainer.innerHTML.trim() === '') {
    // Reutilizamos la lógica de tier list del código original
    const roles = [...new Set(allChars.map(c=>c.rol).filter(Boolean))];
    const tiers = [{min:9,max:10,name:'S+ (9-10)'},{min:8,max:8.99,name:'S (8-9)'},{min:7,max:7.99,name:'A (7-8)'},{min:5,max:6.99,name:'B (5-7)'},{min:3,max:4.99,name:'C (3-5)'},{min:0,max:2.99,name:'D (0-3)'}];
    let html = `<div class="tier-mode-selector"><button class="tier-auto-btn active">📊 Automática</button></div>`;
    for (const rol of roles) {
      html += `<div class="tier-rol-group" style="margin-bottom:2rem;"><h3 style="color:var(--accent2);margin-bottom:0.5rem;">${rol}</h3>`;
      for (const tier of tiers) {
        const charsInTier = allChars.filter(c => {
          const avg = parseFloat(calcPromedio(c, Object.keys(SCORE_LABELS)));
          return c.rol === rol && !isNaN(avg) && avg >= tier.min && avg <= tier.max;
        });
        if (!charsInTier.length) continue;
        html += `<div class="tier-row"><div class="tier-header">${tier.name}</div><div class="tier-cards">`;
        for (const ch of charsInTier) {
          const avg = calcPromedio(ch, Object.keys(SCORE_LABELS));
          html += `<div class="tier-card"><img src="${ch.imagen||''}" alt="${ch.nombre}" onerror="this.style.display='none'"><span>${ch.nombre}</span><span class="avg-score">${avg||'—'}</span></div>`;
        }
        html += `</div></div>`;
      }
      html += `</div>`;
    }
    tierListContainer.innerHTML = html;
  }
}

// ══════════════════════════════════════════════════════════
// INICIALIZACIÓN
// ══════════════════════════════════════════════════════════
async function init() {
  const dot = document.getElementById('status-dot');
  try {
    const rowsChars = await fetchSheetData(SHEET_CHARS);
    allChars = buildCharacters(rowsChars);
    const rowsBang = await fetchSheetData(SHEET_BANGBOOS);
    allBangboos = buildBangboos(rowsBang);
    dot.className = 'status-dot';
    if (!allChars.length) console.warn('No se cargaron personajes');
    if (!allBangboos.length) console.warn('No se cargaron Bangboos');
    // Configurar pestañas
    document.querySelectorAll('.section-tab').forEach(btn => {
      btn.addEventListener('click', () => showSection(btn.dataset.section));
    });
    // Búsqueda
    document.getElementById('search-input').addEventListener('input', function() {
      const term = this.value.toLowerCase().trim();
      if (currentSection === 'characters') { charSearchTerm = term; updateCharList(); }
      else if (currentSection === 'bangboos') { bangbooSearchTerm = term; updateBangbooList(); }
    });
    // Mostrar sección por defecto
    showSection('home');
    // Listeners para descripciones
    setupDescriptionListeners();
  } catch (err) {
    dot.className = 'status-dot error';
    wikiContainer.innerHTML = `<div class="state-screen"><div class="big-icon">⚠</div><h2>ERROR AL CARGAR</h2><div>${err.message}</div></div>`;
    console.error(err);
  }
}

// ══════════════════════════════════════════════════════════
// POPUP TÁCTIL PARA DESCRIPCIONES
// ══════════════════════════════════════════════════════════
let activePopup = null;
function showDescription(text, event) {
  if (activePopup) activePopup.remove();
  const popup = document.createElement('div');
  popup.className = 'description-popup';
  popup.innerHTML = `<button class="close-popup">✕</button><div>${text}</div>`;
  document.body.appendChild(popup);
  const rect = event.target.getBoundingClientRect();
  let left = rect.left + window.scrollX, top = rect.bottom + window.scrollY + 8;
  const popupWidth = 260;
  if (left + popupWidth > window.innerWidth) left = window.innerWidth - popupWidth - 10;
  const popupHeight = popup.offsetHeight;
  if (top + popupHeight > window.scrollY + window.innerHeight) top = rect.top + window.scrollY - popupHeight - 8;
  popup.style.left = left + 'px';
  popup.style.top = top + 'px';
  setTimeout(() => popup.classList.add('visible'), 10);
  activePopup = popup;
  popup.querySelector('.close-popup').addEventListener('click', (e) => { e.stopPropagation(); popup.remove(); activePopup = null; });
  const closeHandler = (e) => {
    if (!popup.contains(e.target) && e.target !== event.target) { popup.remove(); activePopup = null; document.removeEventListener('click', closeHandler); }
  };
  setTimeout(() => document.addEventListener('click', closeHandler), 0);
}
function setupDescriptionListeners() {
  document.addEventListener('click', function(e) {
    let target = e.target;
    if (target.classList?.contains('emoji-badge')) {
      const desc = target.getAttribute('data-desc');
      if (desc) showDescription(desc, e);
      e.preventDefault(); e.stopPropagation();
    } else if (target.classList?.contains('info-icon')) {
      const tip = target.getAttribute('data-tip');
      if (tip) showDescription(tip, e);
      e.preventDefault(); e.stopPropagation();
    }
  });
}

// Iniciar
init();
</script>
